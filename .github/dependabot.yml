version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      opencode-opentui:
        patterns:
          - "@opencode/*"
          - "@opentui/*"
    ignore:
      # @types/node must match the minimum supported runtime (Node 26.4).
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # @opencode/* 2.3.2 pins effect 4.1.0 exactly. A second Effect copy
      # breaks the OpenCode runtime (HTTP 500). Remove this rule and bump
      # OpenCode + effect together once @opencode/* supports 4.1.x.
      - dependency-name: "effect"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
