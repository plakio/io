name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate tag and package version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like vMAJOR.MINOR.PATCH, got: $tag" >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$package_version" ]; then
            echo "Tag $tag does not match package.json version $package_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing io $version"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke test the built executable
        run: npm run test:smoke

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "io $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  notify:
    name: Notify Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send repository dispatch
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "TAP_DISPATCH_TOKEN is not configured for this repository." >&2
            exit 1
          fi
          payload="$(jq -n --arg formula "io" --arg version "$VERSION" \
            '{event_type: "new-release", client_payload: {formula: $formula, version: $version}}')"
          printf '%s' "$payload" | gh api --method POST repos/plakio/homebrew-tap/dispatches --input - --silent
          echo "Notified plakio/homebrew-tap about io $VERSION."
