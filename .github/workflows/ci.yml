name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 26
          - os: macos-latest
            node: 26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate coverage
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage | tee coverage.txt
      - name: Publish coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs coverage.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.txt
          if-no-files-found: warn

  tui-bun:
    name: TUI on Bun
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TUI tests on Bun
        run: bun test test/tui-*.test.ts --timeout 20000

  next-build:
    name: OpenTUI bundle (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the OpenTUI binary
        run: npm run build:next
      - name: Smoke test the OpenTUI binary
        run: ./dist-next/io --version
